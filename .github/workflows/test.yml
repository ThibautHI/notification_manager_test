name: CI - Tests avec couverture

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout du code
        uses: actions/checkout@v4

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # ou la version que tu utilises

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: ✅ Lancer les tests avec couverture
        run: npm run test

      - name: 📤 Uploader les rapports de couverture (en option)
        uses: actions/upload-artifact@v4
        with:
          name: couverture-jest
          path: coverage/
